<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeGuard Security Report</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
  background: #0d1117; color: #c9d1d9; line-height: 1.6; padding: 20px;
}
.container { max-width: 1200px; margin: 0 auto; }
h1 { color: #58a6ff; margin-bottom: 8px; font-size: 28px; }
h2 { color: #58a6ff; margin: 24px 0 12px; font-size: 20px; }
h3 { color: #c9d1d9; margin: 16px 0 8px; font-size: 16px; }
.subtitle { color: #8b949e; margin-bottom: 24px; }
.summary-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px; margin-bottom: 24px;
}
.summary-card {
  background: #161b22; border: 1px solid #30363d; border-radius: 8px;
  padding: 16px; text-align: center;
}
.summary-card .value { font-size: 32px; font-weight: 700; }
.summary-card .label { font-size: 12px; color: #8b949e; text-transform: uppercase; margin-top: 4px; }
.score-good { color: #3fb950; }
.score-medium { color: #d29922; }
.score-bad { color: #f85149; }
.severity-filters { margin-bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
.severity-filters button {
  background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
  border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 13px;
}
.severity-filters button:hover { background: #30363d; }
.severity-filters button.active { border-color: #58a6ff; color: #58a6ff; }
table {
  width: 100%; border-collapse: collapse; margin: 12px 0 24px;
  font-size: 14px;
}
th {
  background: #161b22; text-align: left; padding: 8px 12px;
  border-bottom: 2px solid #30363d; cursor: pointer; user-select: none; white-space: nowrap;
}
th:hover { color: #58a6ff; }
th .sort-arrow { margin-left: 4px; font-size: 11px; }
td { padding: 8px 12px; border-bottom: 1px solid #21262d; }
tr:hover td { background: #161b22; }
.badge-critical { color: #f85149; font-weight: 700; }
.badge-high { color: #d29922; font-weight: 700; }
.badge-medium { color: #d29922; }
.badge-low { color: #58a6ff; }
.blocker-box {
  background: #161b22; border: 1px solid #f85149; border-radius: 8px;
  padding: 16px; margin-bottom: 12px;
}
.blocker-box h3 { color: #f85149; margin-top: 0; }
.blocker-box .evidence { 
  background: #0d1117; border: 1px solid #30363d; border-radius: 4px;
  padding: 8px; margin-top: 8px; font-family: monospace; font-size: 13px; white-space: pre-wrap;
}
footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid #30363d; color: #8b949e; font-size: 13px; }
@media (max-width: 768px) {
  .summary-grid { grid-template-columns: repeat(2, 1fr); }
  table { font-size: 12px; }
  th, td { padding: 6px 8px; }
}
</style>
</head>
<body>
<div class="container">
  <h1>VibeGuard Security Report</h1>
  <p class="subtitle" id="scan-meta">Loading...</p>

  <div class="summary-grid" id="summary-cards"></div>

  <div id="blockers-section" style="display:none">
    <h2>Launch Blockers</h2>
    <div id="blockers-list"></div>
  </div>

  <h2>Findings</h2>
  <div class="severity-filters" id="severity-filters">
    <button data-filter="all" class="active">All</button>
    <button data-filter="critical">Critical</button>
    <button data-filter="high">High</button>
    <button data-filter="medium">Medium</button>
    <button data-filter="low">Low</button>
  </div>
  <table>
    <thead>
      <tr>
        <th data-sort="severity">Severity <span class="sort-arrow"></span></th>
        <th data-sort="title">Title <span class="sort-arrow"></span></th>
        <th data-sort="category">Category <span class="sort-arrow"></span></th>
        <th data-sort="file">File <span class="sort-arrow"></span></th>
      </tr>
    </thead>
    <tbody id="findings-body"></tbody>
  </table>
</div>
<footer>
  <div class="container">
    <p>Generated by VibeGuard. This is an automated security assessment tool. Review all findings before taking action.</p>
  </div>
</footer>

<script>
(function() {
  var data = window.__VIBEGUARD_DATA__;
  if (!data) {
    document.getElementById('scan-meta').textContent = 'No scan data found.';
    return;
  }
  var summary = data.summary;
  var findings = data.findings;
  var currentFilter = 'all';

  var severityOrder = { critical: 0, high: 1, medium: 2, low: 3 };
  var severityClass = { critical: 'badge-critical', high: 'badge-high', medium: 'badge-medium', low: 'badge-low' };
  var severityLabel = { critical: '[CRIT]', high: '[HIGH]', medium: '[MED ]', low: '[LOW ]' };

  document.getElementById('scan-meta').textContent =
    'Target: ' + summary.target + ' | Profile: ' + summary.profile +
    ' | Framework: ' + (summary.framework || 'Unknown') +
    ' | Duration: ' + (summary.scanDuration < 1000 ? summary.scanDuration + 'ms' : (summary.scanDuration / 1000).toFixed(1) + 's') +
    ' | Date: ' + new Date(summary.scanDate).toUTCString();

  function scoreClass(s) {
    if (s >= 80) return 'score-good';
    if (s >= 50) return 'score-medium';
    return 'score-bad';
  }

  var cards = [
    { label: 'Score', value: Math.round(summary.score * 10) / 10, cls: scoreClass(summary.score) },
    { label: 'Findings', value: summary.totalFindings, cls: '' },
    { label: 'Critical', value: summary.bySeverity.critical || 0, cls: 'badge-critical' },
    { label: 'High', value: summary.bySeverity.high || 0, cls: 'badge-high' },
    { label: 'Medium', value: summary.bySeverity.medium || 0, cls: 'badge-medium' },
    { label: 'Low', value: summary.bySeverity.low || 0, cls: 'badge-low' },
  ];
  var cardsHtml = '';
  cards.forEach(function(c) {
    cardsHtml += '<div class="summary-card"><div class="value ' + c.cls + '">' + c.value + '</div><div class="label">' + c.label + '</div></div>';
  });
  document.getElementById('summary-cards').innerHTML = cardsHtml;

  if (summary.launchBlockers && summary.launchBlockers.length > 0) {
    document.getElementById('blockers-section').style.display = 'block';
    var blockersHtml = '';
    summary.launchBlockers.forEach(function(b) {
      blockersHtml += '<div class="blocker-box">';
      blockersHtml += '<h3>' + b.title + '</h3>';
      blockersHtml += '<p><strong>' + severityLabel[b.severity] + ' ' + b.severity.toUpperCase() + '</strong> | ' + b.category + '</p>';
      if (b.location && b.location.file) {
        blockersHtml += '<p>File: ' + b.location.file + (b.location.line ? ':' + b.location.line : '') + '</p>';
      }
      blockersHtml += '<p>' + b.description + '</p>';
      if (b.evidence && b.evidence.length > 0) {
        blockersHtml += '<div class="evidence">' + b.evidence.join('\n') + '</div>';
      }
      blockersHtml += '</div>';
    });
    document.getElementById('blockers-list').innerHTML = blockersHtml;
  }

  function renderTable() {
    var filtered = currentFilter === 'all' ? findings : findings.filter(function(f) { return f.severity === currentFilter; });
    if (filtered.length === 0) {
      document.getElementById('findings-body').innerHTML = '<tr><td colspan="4">No findings match filter.</td></tr>';
      return;
    }
    var rows = '';
    filtered.forEach(function(f) {
      var fileLoc = f.location && f.location.file ? f.location.file + (f.location.line ? ':' + f.location.line : '') : (f.location && f.location.url ? f.location.url : '-');
      rows += '<tr>';
      rows += '<td class="' + (severityClass[f.severity] || '') + '">' + (severityLabel[f.severity] || f.severity) + '</td>';
      rows += '<td>' + f.title + '</td>';
      rows += '<td>' + f.category + '</td>';
      rows += '<td>' + fileLoc + '</td>';
      rows += '</tr>';
    });
    document.getElementById('findings-body').innerHTML = rows;
  }

  var sortDir = {};
  document.querySelectorAll('th[data-sort]').forEach(function(th) {
    th.addEventListener('click', function() {
      var key = th.getAttribute('data-sort');
      sortDir[key] = sortDir[key] === 'asc' ? 'desc' : 'asc';
      var dir = sortDir[key] === 'asc' ? 1 : -1;
      document.querySelectorAll('th .sort-arrow').forEach(function(a) { a.textContent = ''; });
      th.querySelector('.sort-arrow').textContent = dir === 1 ? 'A-Z' : 'Z-A';
      findings.sort(function(a, b) {
        var va, vb;
        if (key === 'severity') {
          va = severityOrder[a.severity];
          vb = severityOrder[b.severity];
        } else if (key === 'file') {
          va = (a.location && a.location.file) || '';
          vb = (b.location && b.location.file) || '';
        } else {
          va = (a[key] || '').toLowerCase();
          vb = (b[key] || '').toLowerCase();
        }
        if (va < vb) return -1 * dir;
        if (va > vb) return 1 * dir;
        return 0;
      });
      renderTable();
    });
  });

  document.querySelectorAll('.severity-filters button').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.severity-filters button').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentFilter = btn.getAttribute('data-filter');
      renderTable();
    });
  });

  renderTable();
})();
</script>
</body>
</html>
