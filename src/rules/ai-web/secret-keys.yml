rules:
  - id: secret-key-in-client
    title: "Secret Key Exposed in Client Code"
    description: "A secret key, service role key, or API credential is exposed in client-side code. This grants full administrative access or authentication bypass. Secrets must never be used in client-side code or exposed in the frontend bundle."
    severity: critical
    confidence: high
    category: secrets
    scanner: ast
    cwe:
      - "CWE-798"
      - "CWE-200"
    owaspTop10:
      - "A05:2021-Security Misconfiguration"
      - "A01:2021-Broken Access Control"
    asvs:
      - "6.4.1"
      - "6.4.2"
    remediation:
      - "Remove the secret key from client-side code"
      - "Use environment variables with server-side only access"
      - "Move sensitive operations to server-side API routes or Edge Functions"
      - "Rotate the compromised key immediately"
      - "Use proxy endpoints or BFF (Backend for Frontend) pattern"
    references:
      - "https://owasp.org/Top10/A05_2021-Security_Misconfiguration/"
      - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
    tags:
      - "secret-leak"
      - "service-role"
      - "critical"
