# VibeCheck CI template - include in your .gitlab-ci.yml:
#
# include:
#   - project: knok12sp/vibe-guard
#     file: /.gitlab-ci-template.yml
#     ref: v0.2.0

vibe-check-scan:
  image: node:20-alpine
  stage: test
  script:
    - apk add --no-cache git
    - npx vibe-check@latest scan repo . --profile standard --fail-on high --json vibe-check-report.json --md vibe-check-report.md
  artifacts:
    paths:
      - vibe-check-report.json
      - vibe-check-report.md
    when: always
  allow_failure: false
